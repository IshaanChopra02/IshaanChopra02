name: Creative GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Creative Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # Base Theme: A sleek, neon dark mode
          config_theme: tokyonight
          base: header, metadata
          
          # Feature 1: 3D Isometric Calendar (Replaces the standard flat grid)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # Feature 2: RPG-Style Achievements (Unlocks badges based on your repos/commits)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          
          # Feature 3: Coding Habits (Visualizes your most active times and days)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Feature 4: Top Languages
          plugin_languages: yes
          plugin_languages_details: percentage
