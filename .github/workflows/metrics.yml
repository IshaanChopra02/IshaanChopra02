name: Vibrant GitHub Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Colorful Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # Increases font size and scales up the entire image
          config_display: large 
          config_theme: dracula
          base: header, activity, repositories
          
          # Colorful 3D Isometric Calendar (Works perfectly)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # Simplified Language Scanner (Fixes the "0 Languages" bug)
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 5
          
          # Lines of Code graph (Safe alternative that works without a PAT)
          plugin_lines: yes
